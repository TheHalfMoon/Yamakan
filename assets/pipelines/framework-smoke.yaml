name: framework-smoke
version: "1.0"
description: Minimal pipeline manifest used to exercise Director stage contracts.
category: custom
stability: beta
default_checkpoint_policy: guided
stages:
  - name: research
    produces:
      - research_brief
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid research_brief artifact
  - name: script
    required_artifacts_in:
      - research_brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid script artifact
  - name: timeline
    required_artifacts_in:
      - script
    produces:
      - timeline
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Places approved shots on the timeline
