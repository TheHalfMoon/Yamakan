name: Qualify imported-media preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    # Pinned: ubuntu-latest moved to 26.04, whose FFmpeg 8 maps some frames differently.
    runs-on: ubuntu-24.04
    # Extra headroom for bounded npm audit retries during registry outages.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The job needs no git access after this, so its token is not left in .git.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      # A stuck package mirror used to take this whole job to its time limit, before
      # any test ran, and cancel the run. Each try is bounded, and it fails plainly.
      - name: Install FFmpeg and fonts
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 60 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update &&
              timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y ffmpeg fonts-dejavu-core; then
              exit 0
            fi
            echo "Package install attempt $attempt did not finish."
            sleep 15
          done
          exit 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run provenance:check
      - run: npm run brand:check
      # Same gate: audit must pass. Retries only cover transient registry 5xx/timeouts
      # (npm status outages); never treats audit failure or skipped scan as success.
      - name: npm audit (high, bounded registry retry)
        env:
          npm_config_fetch_timeout: "60000"
          npm_config_fetch_retries: "1"
        run: |
          set -euo pipefail
          attempt=1
          max=6
          delay=20
          while true; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "npm audit failed after ${max} attempts" >&2
              exit 1
            fi
            echo "npm audit attempt ${attempt}/${max} failed (likely registry); retry in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay + 20))
          done
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
        env:
          DARZAIN_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-workflow
          path: work/browser-e2e/
          if-no-files-found: ignore
          retention-days: 7

  # R8/Q3: Windows fontconfig FFmpeg pin (LFS), bundle hash gate, Q3 controls.
  # spawnSync Q3 + provider probe do not require procd; full typography suite stays local.
  qualify-windows-r8:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          # The job needs no git access after this, so its token is not left in .git.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create clean TEMP for ProjectStore
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "yamakan-tmp"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          echo "TEMP=$dir" >> $env:GITHUB_ENV
          echo "TMP=$dir" >> $env:GITHUB_ENV
      - run: node --test tests/bundle.test.ts
      - run: node --test --test-name-pattern "Q3:" tests/typography.test.ts
      - run: pwsh -File scripts/vendor/probe-r8-fontconfig.ps1

  # Q12 / M16: OpenTimelineIO Python oracle reads Yamakan OTIO at flick rate.
  otio-oracle:
    # Pinned: ubuntu-latest moved to 26.04, whose FFmpeg 8 maps some frames differently.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The job needs no git access after this, so its token is not left in .git.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # By hash: a package that does not match is refused, and nothing else is installed.
      - run: pip install --disable-pip-version-check --require-hashes --no-deps -r scripts/ci/otio-requirements.txt
      - run: node scripts/write-otio-fixture.mjs
      - run: python scripts/otio-oracle.py docs/evidence/qualification/otio-fixture.otio
