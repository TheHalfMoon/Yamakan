name: Provenance security monthly
on:
  schedule:
    # 06:00 UTC on the 1st of each month
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upstream drift report (copied donors)
        run: |
          set -e
          for src in \
            LudwigKienle/ai-video-production-editor \
            TheHalfMoon/Ninerr \
            OpenCut-app/opencut-classic \
            TheHalfMoon/Skelet
          do
            echo "=== ${src} ==="
            node scripts/provenance.mjs --upstream "$src" || true
          done
      - run: npm audit --audit-level=high
      - name: FFmpeg CVE note
        run: |
          echo "Manual step: review FFmpeg security advisories for the pinned binary build (W5 release gate)."
