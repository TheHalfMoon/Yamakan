# The real checks (npm run qualify:*) that the founder's own computer cannot run today, on
# GitHub's Windows machine: the real service, FFmpeg in its sandbox, and real Edge. They run when
# a person starts them, or when a pull request changes one of them. Each prints its receipt,
# which names the commit and the host. This adds checks and replaces none: nothing in
# qualify.yml depends on it, and a check that cannot run here is a failure or BLOCKED, never a
# pass. No model, no paid service and no secret is used.
name: Real checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/real-checks.yml
      - scripts/qualify-revisable-shot.mjs
      - scripts/qualify-create-durable.mjs
      - scripts/qualify-take-review.mjs
      - scripts/qualify-consent-gate.mjs
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          # The commit itself, so that a receipt names it, not a merge made for the run.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The job needs no git access after this, so its token is not left in .git.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The native helpers: no dependencies (native/procd/Cargo.toml), from the machine's own Rust.
      - run: npm run build:native -- --locked --offline
      - name: Create clean TEMP and a folder for receipts
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "yamakan-tmp"
          $receipts = Join-Path $env:RUNNER_TEMP "receipts"
          New-Item -ItemType Directory -Force -Path $dir, $receipts | Out-Null
          echo "TEMP=$dir" >> $env:GITHUB_ENV
          echo "TMP=$dir" >> $env:GITHUB_ENV
          echo "RECEIPTS=$receipts" >> $env:GITHUB_ENV
      # Whether the sandbox starts a worker here at all, before anything relies on it.
      - run: node --test tests/process-owner.test.ts tests/probe.test.ts
      - name: A take's record, end to end (MPR-101)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node scripts/qualify-revisable-shot.mjs (Join-Path $env:RECEIPTS "MPR-101-take-record.json")
      - name: A made video's record lasts, in real Edge (MPR-101)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node scripts/qualify-create-durable.mjs (Join-Path $env:RECEIPTS "create-durable.json")
      - name: Take review and a split shot, in real Edge (SS-006, MPR-105)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node scripts/qualify-take-review.mjs (Join-Path $env:RECEIPTS "take-review.json") (Join-Path $env:RECEIPTS "MPR-105-split-shot-replace.json")
      - name: Consent gate and a pinned take, in real Edge (MPR-010)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node scripts/qualify-consent-gate.mjs (Join-Path $env:RECEIPTS "consent-gate.json")
      - name: Print the receipts
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Get-ChildItem $env:RECEIPTS -Filter *.json | ForEach-Object {
            Write-Output "===== $($_.Name)"
            Get-Content -Raw $_.FullName
          }
