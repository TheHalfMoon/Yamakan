# The real checks (npm run qualify:*) that the founder's own computer cannot run today, on
# GitHub's Linux machine, with the FFmpeg its packages have. The first uses the real store, job
# table and commands in one process, with the stand-in engine; the other three use the real
# service and the Microsoft Edge the machine has. They run when a person starts them, or when a
# pull request changes this file or one of them (not when the product changes). Each prints its
# receipt, which names the commit and what the machine had. This adds checks and replaces none:
# nothing in qualify.yml depends on it, it is not to be made a required check (it does not run for
# most pull requests), and a check that cannot run here is a failure or BLOCKED, never a pass. No
# model, no paid service and no secret is used.
#
# Not on GitHub's Windows machine: there, three tests of a sandboxed worker ended with Windows
# status 0xC0000142, the media probe failed, and so did all four checks (run
# 45190159942). The sandbox is not loosened for it. So a pass here says nothing of the Windows
# sandbox: on Linux a media worker has none (core/process/owner.ts, "posix-unqualified").
name: Real checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/real-checks.yml
      - scripts/qualify-host.mjs
      - scripts/qualify-revisable-shot.mjs
      - scripts/qualify-create-durable.mjs
      - scripts/qualify-take-review.mjs
      - scripts/qualify-consent-gate.mjs
permissions:
  contents: read
# A newer commit's run replaces an older one's.
concurrency:
  group: real-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-checks-linux:
    # As qualify.yml's own job: its FFmpeg is the one the tests know.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The commit itself, so that a receipt names it, not a merge made for the run.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The job needs no git access after this, so its token is not left in .git.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      # As in qualify.yml.
      - name: Install FFmpeg and fonts
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            if timeout 60 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update &&
              timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
              exit 0
            fi
            echo "Package install attempt $attempt did not finish."
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The browser this machine has
        run: microsoft-edge --version
      - run: mkdir -p "$RUNNER_TEMP/receipts"
      - name: A take's record, a run made for a shot and its history, end to end (MPR-101, MPR-102, MPR-107)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/qualify-revisable-shot.mjs "$RUNNER_TEMP/receipts/MPR-101-take-record.json" "$RUNNER_TEMP/receipts/MPR-102-shot-target.json" "$RUNNER_TEMP/receipts/MPR-107-shot-history.json"
      - name: A made video's record lasts, in real Edge (MPR-101)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/qualify-create-durable.mjs "$RUNNER_TEMP/receipts/create-durable.json"
      - name: The brief, scripts and shot texts of a story, in real Edge (MPR-106)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/qualify-story-brief.mjs "$RUNNER_TEMP/receipts/MPR-106-story-brief.json"
      - name: Take review and a split shot, in real Edge (SS-006, MPR-105)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/qualify-take-review.mjs "$RUNNER_TEMP/receipts/take-review.json" "$RUNNER_TEMP/receipts/MPR-105-split-shot-replace.json"
      - name: Consent gate and a pinned take, in real Edge (MPR-010)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node scripts/qualify-consent-gate.mjs "$RUNNER_TEMP/receipts/consent-gate.json"
      - name: Print the receipts
        if: ${{ !cancelled() }}
        run: |
          for f in "$RUNNER_TEMP"/receipts/*.json; do
            echo "===== $(basename "$f")"
            cat "$f"
          done
